name: Sizable Energy
description: 'Sizable Energy is a Milan, Italy based clean-energy company developing
  offshore pumped hydro energy storage. Its patented system pairs subsea and floating
  reservoirs connected by pipes with reversible pump-turbines that move saturated sea-salt
  brine between them to deliver long-duration, grid-scale energy storage. The modular,
  scalable design leverages proven pumped-hydro technology with zero land use and integrates
  with floating wind and solar installations. It was added to the API Evangelist network
  as a portfolio company of Playground Global; as of this enrichment pass the company
  publishes no public API, developer portal, or SDKs.'
